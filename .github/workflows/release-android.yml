name: Android ARM64 release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: tool/firestore-rules-tests/package-lock.json
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${RELEASE_TAG#v}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi

          app_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+[[:space:]]*$/\1/p' pubspec.yaml)"
          app_build="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          if [[ -z "${app_version}" || -z "${app_build}" || "${tag_version}" != "${app_version}" ]]; then
            echo "::error::The tag must match the MAJOR.MINOR.PATCH version in pubspec.yaml."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for ${RELEASE_TAG}."
            exit 1
          fi

          latest_tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --json tagName --limit 1 --jq '.[0].tagName' 2>/dev/null || true)"
          if [[ "${latest_tag}" == "null" ]]; then
            latest_tag=""
          fi
          if [[ -n "${latest_tag}" ]]; then
            previous_version="$(git show "${latest_tag}:pubspec.yaml" | sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+[[:space:]]*$/\1/p')"
            latest_build="$(git show "${latest_tag}:pubspec.yaml" | sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)[[:space:]]*$/\1/p')"
            if [[ -z "${latest_build}" || "${app_build}" -le "${latest_build}" ]]; then
              echo "::error::The Android build number must be greater than the latest release."
              exit 1
            fi
            python3 - "${app_version}" "${previous_version}" <<'PY'
          import sys

          current = tuple(int(part) for part in sys.argv[1].split("."))
          previous = tuple(int(part) for part in sys.argv[2].split("."))
          if current <= previous:
              raise SystemExit("The semantic version must be greater than the latest release.")
          PY
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: npm ci --prefix tool/firestore-rules-tests
      - run: npm audit --prefix tool/firestore-rules-tests --audit-level=moderate
      - run: npm test --prefix tool/firestore-rules-tests
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            FIREBASE_API_KEY \
            FIREBASE_PROJECT_ID \
            FIREBASE_MESSAGING_SENDER_ID \
            FIREBASE_ANDROID_APP_ID \
            FIREBASE_WEB_APP_ID \
            FIREBASE_AUTH_DOMAIN \
            FIREBASE_STORAGE_BUCKET \
            GOOGLE_SERVER_CLIENT_ID \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret ${name} is missing."
              exit 1
            fi
          done
      - name: Prepare release credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cadence-tasks-release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/cadence-tasks-release.jks" >> "${GITHUB_ENV}"
          python3 - <<'PY'
          import json
          import os

          keys = (
              "FIREBASE_API_KEY",
              "FIREBASE_PROJECT_ID",
              "FIREBASE_MESSAGING_SENDER_ID",
              "FIREBASE_ANDROID_APP_ID",
              "FIREBASE_WEB_APP_ID",
              "FIREBASE_AUTH_DOMAIN",
              "FIREBASE_STORAGE_BUCKET",
              "GOOGLE_SERVER_CLIENT_ID",
          )
          with open(".env", "w", encoding="utf-8") as environment_file:
              json.dump({key: os.environ[key] for key in keys}, environment_file)
          PY
      - name: Verify release keystore fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected_sha1="98687310a9f02058e367856e2361a4bcaa4a14f0"
          certificate_file="${RUNNER_TEMP}/cadence-tasks-release-certificate.der"
          trap 'rm -f "${certificate_file}"' EXIT
          keytool -exportcert \
            -keystore "${ANDROID_KEYSTORE_PATH}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            -file "${certificate_file}" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            >/dev/null
          keystore_sha1="$(sha1sum "${certificate_file}" | awk '{print $1}')"
          if [[ "${keystore_sha1}" != "${expected_sha1}" ]]; then
            echo "::error::The uploaded keystore has SHA-1 ${keystore_sha1}; it does not match the Firebase release certificate."
            exit 1
          fi
      - name: Build ARM64 APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=.env
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          apk_path="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          release_asset="cadence-tasks-${version}-android-arm64.apk"
          test -f "${apk_path}"
          build_tools="${ANDROID_HOME}/build-tools/$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          package_name="$("${build_tools}/aapt" dump badging "${apk_path}" | sed -nE "s/^package: name='([^']+)'.*/\1/p")"
          native_abis="$("${build_tools}/aapt" dump badging "${apk_path}" | sed -nE 's/^native-code: (.*)$/\1/p')"
          if ! signer_report="$("${build_tools}/apksigner" verify --print-certs "${apk_path}" 2>&1)"; then
            echo "::error::apksigner could not verify the ARM64 APK."
            printf '%s\n' "${signer_report}"
            exit 1
          fi
          signer_sha1="$(printf '%s\n' "${signer_report}" | awk 'tolower($0) ~ /sha-1 digest:/ { digest = $NF; gsub(/[^[:xdigit:]]/, "", digest); print tolower(digest); exit }')"
          expected_sha1="98687310a9f02058e367856e2361a4bcaa4a14f0"
          if [[ "${package_name}" != "com.al7474.cadence_tasks" || "${native_abis}" != "'arm64-v8a'" ]]; then
            echo "::error::The release APK must be Cadence Tasks for ARM64 only."
            exit 1
          fi
          if [[ -z "${signer_sha1}" ]]; then
            echo "::error::Could not extract the APK signer SHA-1. apksigner output follows:"
            printf '%s\n' "${signer_report}"
            exit 1
          fi
          if [[ "${signer_sha1}" != "${expected_sha1}" ]]; then
            echo "::error::The APK signer SHA-1 is ${signer_sha1}; expected ${expected_sha1}."
            exit 1
          fi
          cp "${apk_path}" "${release_asset}"
          gh release create "${RELEASE_TAG}" "${release_asset}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cadence Tasks ${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag

name: cadence_tasks
description: An offline-first routine and task manager.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  cloud_firestore: ^7.2.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.3
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  timezone: ^0.11.2
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.35.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
